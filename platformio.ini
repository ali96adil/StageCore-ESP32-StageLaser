[platformio]
default_envs = esp32c3-ci-no-actuation

; CI/reference build target only. The physical StageLaser unit is now verified
; as ESP32-C3 QFN32 rev v0.4 with embedded XMC 4 MB flash and 40 MHz crystal.
; This env deliberately remains NO-ACTUATION and does not choose relay GPIO/polarity.
[env:esp32c3-ci-no-actuation]
platform = espressif32@6.12.0
framework = espidf
board = esp32-c3-devkitm-1
; CI-only generic board geometry. This is NOT a StageLaser hardware qualification.
; Generic DevKitM-1 build surrogate;
; 4 MB capacity matches the verified physical StageLaser unit.
; Production OTA partition geometry is still unqualified.
board_upload.flash_size = 4MB
board_build.partitions = partitions-ci-4mb.csv
monitor_speed = 115200
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
extra_scripts =
  pre:scripts/stamp_build_revision.py
build_flags =
  -DSTAGECORE_FW_VERSION=\"0.1.0-dev.1\"
  -DSTAGECORE_LASER_ACTUATION_ENABLED=0
  -DSTAGECORE_LASER_OUTPUT_GPIO=-1
  -DSTAGECORE_LASER_SHARED_POWER_QUALIFIED=0
