name: Firmware CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: stagelaser-firmware-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Test pure StageLaser state machine
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            src/laser_state_machine.cpp tests/state_machine_test.cpp \
            -o /tmp/stagelaser-state-machine-test
          /tmp/stagelaser-state-machine-test
      - name: Test StageLaser transaction controller
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            src/laser_state_machine.cpp src/laser_controller.cpp \
            tests/laser_controller_test.cpp \
            -o /tmp/stagelaser-controller-test
          /tmp/stagelaser-controller-test
      - name: Test Wi-Fi reconnect policy
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            tests/wifi_reconnect_policy_test.cpp \
            -o /tmp/stagelaser-wifi-policy-test
          /tmp/stagelaser-wifi-policy-test
      - name: Test StageLaser timing limits
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            src/laser_limits.cpp tests/laser_limits_test.cpp \
            -o /tmp/stagelaser-limits-test
          /tmp/stagelaser-limits-test
      - name: Test local recovery hold policy
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            tests/recovery_policy_test.cpp \
            -o /tmp/stagelaser-recovery-policy-test
          /tmp/stagelaser-recovery-policy-test
      - name: Verify active v2 runtime contract
        run: python -m unittest tests/assignment_runtime_contract_test.py -v
      - name: Verify no raw toggle and no-actuation default
        run: python -m unittest discover -s tests -p '*_test.py' -v

  firmware-build-no-actuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORMIO_DISABLE_UPGRADE_CHECK: "1"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build CI no-actuation image
        run: pio run -e esp32c3-ci-no-actuation
      - name: Prove artifact is no-actuation
        run: |
          set -euo pipefail
          grep -q -- '-DSTAGECORE_LASER_ACTUATION_ENABLED=0' platformio.ini
          grep -q -- '-DSTAGECORE_LASER_OUTPUT_GPIO=-1' platformio.ini
          test -f .pio/build/esp32c3-ci-no-actuation/firmware.bin
      - name: Build GPIO3 no-load qualification image
        run: pio run -e esp32c3-gpio3-no-load-qualification
      - name: Prove GPIO3 qualification image is still no-actuation
        run: |
          set -euo pipefail
          test -f .pio/build/esp32c3-gpio3-no-load-qualification/firmware.bin
          grep -A15 '^\[env:esp32c3-gpio3-no-load-qualification\]' platformio.ini | grep -q -- 'extends = env:esp32c3-ci-no-actuation'
          grep -A15 '^\[env:esp32c3-gpio3-no-load-qualification\]' platformio.ini | grep -q -- 'STAGECORE_GPIO_NO_LOAD_QUALIFICATION_GPIO=3'
      - name: Build 4MB OTA candidate as no-actuation
        run: pio run -e esp32c3-ota-candidate-no-actuation
      - name: Prove OTA candidate artifact is no-actuation
        run: |
          set -euo pipefail
          test -f .pio/build/esp32c3-ota-candidate-no-actuation/firmware.bin
          grep -A30 '^\[env:esp32c3-ota-candidate-no-actuation\]' platformio.ini | grep -q -- '-DSTAGECORE_LASER_ACTUATION_ENABLED=0'
          grep -A30 '^\[env:esp32c3-ota-candidate-no-actuation\]' platformio.ini | grep -q -- '-DSTAGECORE_LASER_OUTPUT_GPIO=-1'
      - name: Prove OTA rollback is enabled only for candidate
        run: |
          set -euo pipefail
          grep -q '^CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y$' sdkconfig.esp32c3-ota-candidate-no-actuation
          if grep -q '^CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y$' sdkconfig.esp32c3-ci-no-actuation; then
            echo "rollback unexpectedly enabled in default CI image" >&2
            exit 1
          fi
      - name: Validate OTA candidate layout and firmware fit
        run: |
          python tools/check_ota_candidate.py \
            --partitions partitions-ota-candidate-4mb.csv \
            --firmware .pio/build/esp32c3-ota-candidate-no-actuation/firmware.bin
      - name: Stage exact unqualified firmware artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

          OUT="$RUNNER_TEMP/stagelaser-unqualified"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for spec in \
            "default:esp32c3-ci-no-actuation" \
            "gpio3-no-load:esp32c3-gpio3-no-load-qualification" \
            "ota-candidate:esp32c3-ota-candidate-no-actuation"
          do
            NAME="${spec%%:*}"
            ENV_NAME="${spec#*:}"
            SRC=".pio/build/${ENV_NAME}/firmware.bin"
            test -f "$SRC"
            strings "$SRC" | grep -F "$EXPECTED_SHA"
            cp "$SRC" "$OUT/${NAME}.bin"
          done

          (
            cd "$OUT"
            sha256sum default.bin gpio3-no-load.bin ota-candidate.bin > SHA256SUMS
          )

          {
            echo "source_revision=$EXPECTED_SHA"
            echo "platformio=6.2.0"
            echo "qualification=UNQUALIFIED"
            echo "actuation_enabled=0"
            echo "output_gpio=-1"
            echo "shared_power_qualified=0"
            echo "local_recovery_gpio=-1"
            echo "local_recovery_qualified=0"
          } > "$OUT/BUILDINFO"

          git diff --quiet
          git diff --cached --quiet

      - name: Upload exact unqualified firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stagecore-stagelaser-unqualified
          path: ${{ runner.temp }}/stagelaser-unqualified/
          retention-days: 7
          if-no-files-found: error
